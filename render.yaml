# =============================================================================
# render.yaml - Render Blueprint for LifelineSMS Gateway
# =============================================================================
# Commit this file and Render can create the service from it
# (New + -> Blueprint), instead of you filling in the dashboard by hand.
#
# `sync: false` means "prompt me for this value, never store it in git". Every
# secret below is marked that way, so no credential ever lands in the repo.
#
# AFTER THE FIRST DEPLOY, set APP_ORIGIN and GOOGLE_CLIENT_ID:
#   1. Copy this service's public URL (shown at the top of the Render dashboard).
#   2. Set APP_ORIGIN to that URL, with no trailing slash.
#      Without it, the CSRF origin check rejects every send.
#   3. Set GOOGLE_CLIENT_ID and add the same URL as an Authorised JavaScript
#      origin at https://console.cloud.google.com/apis/credentials
# =============================================================================

services:
  - type: web
    name: lifelinesms-gateway
    runtime: node
    plan: starter          # `free` sleeps after 15 min, which kills in-memory sessions
    region: singapore      # Closest Render region to the Philippines
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # --- Runtime -----------------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.11.0"

      # --- Public URL (REQUIRED - set after the first deploy) ---------------
      # Must match the origin that serves the page, or CSRF rejects every send.
      - key: APP_ORIGIN
        sync: false

      # --- Secrets (generated by Render, never visible in git) --------------
      - key: SESSION_SECRET
        generateValue: true
      - key: AUDIT_HASH_SALT
        generateValue: true

      # --- Google sign-in (REQUIRED for any real use) -----------------------
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- SMS provider -----------------------------------------------------
      # Leave as `mock` until you are ready to send real, billable messages.
      - key: SMS_PROVIDER
        value: mock
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        value: LIFELINE

      # --- Moderation tuning -------------------------------------------------
      - key: MODERATION_BLOCK_THRESHOLD
        value: "60"
      # Set to `true` to log violations without changing user-visible behaviour.
      # Useful for measuring false positives before you enforce.
      - key: MODERATION_DRY_RUN
        value: "false"
      # Optional LLM second opinion. Leave blank to run deterministic-only.
      - key: AI_GUARD_ENDPOINT
        sync: false
      - key: AI_GUARD_API_KEY
        sync: false

      # --- Abuse controls ----------------------------------------------------
      - key: FREE_MESSAGES_PER_DAY
        value: "3"
      - key: MAX_SENDS_PER_IP_PER_HOUR
        value: "20"
      - key: MIN_ACCOUNT_AGE_SECONDS
        value: "60"

      # --- Audit trail -------------------------------------------------------
      # NOTE: this filesystem is EPHEMERAL. The audit log is lost on every
      # deploy and every restart. Attach a Render disk (paid plans) and point
      # this at the mount path, or the log cannot serve as compliance evidence.
      - key: AUDIT_LOG_PATH
        value: /var/data/audit.log

    # Persistent disk for the audit trail. Requires a paid plan.
    # Uncomment together with a matching AUDIT_LOG_PATH above.
    # disk:
    #   name: lifelinesms-audit
    #   mountPath: /var/data
    #   sizeGB: 1
